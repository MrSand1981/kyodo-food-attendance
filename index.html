<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo-kyodo.png" />

    <!-- Viewport chuẩn tối ưu cho iPhone/iPad (Hỗ trợ Dynamic Island, Tai Thỏ Notch, Safe Area) -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />

    <!-- Tiêu chuẩn Apple Web App & iOS PWA (Chạy độc lập mượt mà như ứng dụng gốc App Store) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Kyodo Food" />
    <link rel="apple-touch-icon" href="/logo-kyodo.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/logo-kyodo.png" />

    <!-- Web App Manifest (PWA) -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#f59e0b" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Chống iOS Safari tự động highlight dãy số CCCD/ngày tháng thành link gọi điện thoại -->
    <meta name="format-detection" content="telephone=no, date=no, address=no, email=no" />

    <title>Kyodo Food App - Chấm Công & Quản Lý</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-slate-50 text-slate-800 antialiased selection:bg-amber-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
