<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bg-nu" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <linearGradient id="badge-nu" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#881337" />
      <stop offset="100%" stop-color="#4c0519" />
    </linearGradient>
    <filter id="shadow-f" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Background Circle -->
  <circle cx="60" cy="60" r="58" fill="url(#bg-nu)" stroke="#ffffff" stroke-width="3" />
  
  <!-- Subtle inner decorative ring -->
  <circle cx="60" cy="60" r="54" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="2" />

  <!-- Female Silhouette: Hair + Head -->
  <!-- Feminine Hair Silhouette (bun/curves) -->
  <path d="M41 44 C41 26 49 20 60 20 C71 20 79 26 79 44 C79 56 77 64 74 68 C71 65 67 62 60 62 C53 62 49 65 46 68 C43 64 41 56 41 44 Z" fill="#ffffff" filter="url(#shadow-f)" />
  <circle cx="60" cy="41" r="18" fill="#ffffff" filter="url(#shadow-f)" />

  <!-- Female Silhouette: Shoulders / Torso -->
  <path d="M27 102 C27 78 41 68 60 68 C79 68 93 78 93 102 C93 107 90 110 85 110 L35 110 C30 110 27 107 27 102 Z" fill="#ffffff" filter="url(#shadow-f)" />

  <!-- Badge: NỮ ♀ -->
  <g transform="translate(66, 84)" filter="url(#shadow-f)">
    <!-- Pill background -->
    <rect x="0" y="0" width="48" height="26" rx="13" fill="url(#badge-nu)" stroke="#ffffff" stroke-width="2.5" />
    <!-- Text NỮ -->
    <text x="18" y="17.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="11" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">NỮ</text>
    <!-- Venus Symbol ♀ -->
    <circle cx="34" cy="11.5" r="3.8" fill="none" stroke="#fda4af" stroke-width="1.8" />
    <line x1="34" y1="15.3" x2="34" y2="21" stroke="#fda4af" stroke-width="1.8" stroke-linecap="round" />
    <line x1="31.2" y1="18.2" x2="36.8" y2="18.2" stroke="#fda4af" stroke-width="1.8" stroke-linecap="round" />
  </g>
</svg>
