<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bg-fem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fda4af" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
    <linearGradient id="skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa" />
      <stop offset="100%" stop-color="#fdba74" />
    </linearGradient>
    <linearGradient id="hair" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>
  <!-- Background Circle -->
  <circle cx="60" cy="60" r="58" fill="url(#bg-fem)" stroke="#fff" stroke-width="4" />
  
  <!-- Long Hair Back -->
  <path d="M35 55 C35 30 85 30 85 55 C88 78 84 95 80 102 C75 102 72 85 72 85 L48 85 C48 85 45 102 40 102 C36 95 32 78 35 55 Z" fill="url(#hair)" />
  
  <!-- Neck -->
  <rect x="52" y="70" width="16" height="18" rx="4" fill="url(#skin)" />
  
  <!-- Collar / Clothes -->
  <path d="M30 114 C30 92 45 88 60 88 C75 88 90 92 90 114 Z" fill="#ffffff" />
  <path d="M42 90 L60 104 L78 90" stroke="#f43f5e" stroke-width="2.5" fill="none" stroke-linecap="round" />
  
  <!-- Face -->
  <ellipse cx="60" cy="56" rx="20" ry="24" fill="url(#skin)" />
  
  <!-- Bangs / Front Hair -->
  <path d="M40 50 C40 33 50 25 60 25 C70 25 80 33 80 50 C75 42 68 40 60 42 C52 40 45 42 40 50 Z" fill="url(#hair)" />
  
  <!-- Eyes -->
  <ellipse cx="52" cy="56" rx="2.2" ry="3" fill="#1e293b" />
  <ellipse cx="68" cy="56" rx="2.2" ry="3" fill="#1e293b" />
  <!-- Eye sparkles -->
  <circle cx="53" cy="55" r="0.8" fill="#fff" />
  <circle cx="69" cy="55" r="0.8" fill="#fff" />
  
  <!-- Smile -->
  <path d="M55 67 Q60 72 65 67" stroke="#e11d48" stroke-width="2" fill="none" stroke-linecap="round" />
  
  <!-- Cheeks -->
  <circle cx="48" cy="62" r="3.5" fill="#f43f5e" opacity="0.4" />
  <circle cx="72" cy="62" r="3.5" fill="#f43f5e" opacity="0.4" />
</svg>
