<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bg-nam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="badge-nam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Background Circle -->
  <circle cx="60" cy="60" r="58" fill="url(#bg-nam)" stroke="#ffffff" stroke-width="3" />
  
  <!-- Subtle inner decorative ring -->
  <circle cx="60" cy="60" r="54" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="2" />

  <!-- Male Silhouette: Head -->
  <circle cx="60" cy="40" r="19" fill="#ffffff" filter="url(#shadow)" />

  <!-- Male Silhouette: Shoulders / Torso -->
  <path d="M25 102 C25 76 40 66 60 66 C80 66 95 76 95 102 C95 107 92 110 87 110 L33 110 C28 110 25 107 25 102 Z" fill="#ffffff" filter="url(#shadow)" />

  <!-- Badge: NAM ♂ -->
  <g transform="translate(62, 84)" filter="url(#shadow)">
    <!-- Pill background -->
    <rect x="0" y="0" width="52" height="26" rx="13" fill="url(#badge-nam)" stroke="#ffffff" stroke-width="2.5" />
    <!-- Text NAM -->
    <text x="21" y="17.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="11" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">NAM</text>
    <!-- Mars Symbol ♂ -->
    <circle cx="39" cy="14" r="4" fill="none" stroke="#60a5fa" stroke-width="1.8" />
    <line x1="41.8" y1="11.2" x2="46" y2="7" stroke="#60a5fa" stroke-width="1.8" stroke-linecap="round" />
    <path d="M43 7 L46 7 L46 10" stroke="#60a5fa" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>
</svg>
