services:
  - type: web
    name: kyodo-food-attendance-2
    env: node
    plan: free
    region: singapore
    buildCommand: npm install --legacy-peer-deps && npm run build
    startCommand: npm start
    healthCheckPath: /api/ping
    envVars:
      - key: NODE_VERSION
        value: 22.11.0
      - key: TZ
        value: Asia/Ho_Chi_Minh
