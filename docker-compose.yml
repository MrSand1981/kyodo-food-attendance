  #     MONGO_INITDB_DATABASE: kyodo_food
  #   volumes:
  #     - mongodb_data:/data/db
  #   ports:
  #     - "27017:27017"
  #   healthcheck:
  #     test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
  #     interval: 30s
  #     timeout: 10s
  #     retries: 3
  #     start_period: 10s

  # =============================================================================
  # Optional: Nginx Reverse Proxy (for SSL termination)
  # =============================================================================
  # nginx:
  #   image: nginx:alpine
  #   container_name: kyodo-nginx
  #   restart: unless-stopped
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ./ssl:/etc/nginx/ssl:ro
  #   depends_on:
  #     - kyodo-app

volumes:
  # Named volume for MongoDB (if enabled)
  # mongodb_data:

  # Named volume for application data (alternative to bind mount)
